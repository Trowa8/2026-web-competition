<div class="teams-page">
    <div class="hero">
        <h1>Teams</h1>
        <p>All registered teams</p>
    </div>

    <div class="container">
        <div class="card">
            <div class="card-header">
                <h2>📋 Teams List</h2>
                <span class="badge">16 teams</span>
            </div>
            <div class="card-body">
                <div class="teams-grid">
                    <div *ngFor="let team of teams" class="team-item">
                        <span class="team-number">{{ team.id }}.</span>
                        <span class="team-name">{{ team.name }}</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
