<div class="profile-layout">
    <aside class="left-sidebar">
        <nav class="nav-stack">
            <div
                *ngFor="let item of ['Турнір #1', 'Турнір #2', 'Турнір #3']"
                class="nav-anchor"
                [class.active]="activeNav() === item"
                (click)="setNav(item)"
            >
                {{item}}
            </div>
        </nav>
    </aside>

    <main class="main-viewport">
        <div class="content-bound">
            <header class="hero-block">
                <h1 class="hero-title">Профіль команди</h1>
                <button class="btn-black btn-fixed-w" (click)="toggleEdit()">
                    {{ isEditing() ? 'Зберегти' : 'Редагувати' }}
                </button>
            </header>

            <section class="ui-section">
                <h2 class="caps-label">ІНФОРМАЦІЯ ПРО КОМАНДУ</h2>
                <div class="team-card-grey">
                    <div class="card-flex-group">
                        <div class="team-meta">
                            @if (!isEditing()) {
                            <ng-container>
                                <h3 class="team-name-big">{{ team().name }}</h3>
                                <p class="team-bio-text">{{ team().description }}</p>
                            </ng-container>
                            } @else {
                            <ng-template>
                                <input [(ngModel)]="team().name" class="edit-input-title" />
                                <textarea [(ngModel)]="team().description" class="edit-input-text"></textarea>
                            </ng-template>
                            }

                            <span class="pub-timestamp">Створено: {{ team().createdAt }}</span>
                        </div>
                    </div>
                </div>

                <div class="action-row-flex">
                    <div class="invite-box">
                        <input
                            type="email"
                            placeholder="Email користувача"
                            [(ngModel)]="inviteEmail"
                            class="invite-input"
                        />
                        <button class="btn-black" (click)="onInvite()">+ Запросити</button>
                    </div>
                </div>
            </section>
        </div>
    </main>
</div>
