<div class="profile-container">
    <header class="header-main">
        <h1>{{ team().name }}</h1>
        <p class="meta-info">Створено: {{ team().createdAt }}</p>
        <div class="btn-group">
            <button class="btn-yellow">Редагувати</button>
            <button class="btn-outline">Видалити</button>
        </div>
    </header>

    <div class="card-modern">
        <div class="accent-line"></div>
        <h3>Про команду</h3>
        <p class="desc">{{ team().description }}</p>
    </div>

    <div class="card-modern">
        <div class="accent-line"></div>
        <h3>Учасники</h3>
        <div class="members-grid">
            @for (m of team().members; track m.id) {
            <div class="member-card">
                <span class="m-name">👤 {{ m.login }}</span>
                <span class="m-role">{{ m.role }}</span>
            </div>
            }
        </div>

        <div class="join-form">
            <label>Вхід для учасників</label>
            <input type="text" [(ngModel)]="joinCode" placeholder="000000" maxlength="6">
            <button class="btn-blue-action" [disabled]="joinCode().length !== 6" (click)="onJoin()">Увійти</button>
        </div>
    </div>

    <div class="card-modern">
        <div class="accent-line"></div>
        <h3>Історія турнірів</h3>
        <div class="tournament-entry">
            <span class="t-title">{{ tournaments()[0].name }}</span>
            <span class="t-date">{{ tournaments()[0].dates }}</span>
        </div>
    </div>
</div>
