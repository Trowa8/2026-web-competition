<div class="card">
    <div class="card-header">
        <h2>Team Information</h2>
    </div>
    <div class="card-body">
        <div class="form-group">
            <label>Team Name *</label>
            <input type="text" [(ngModel)]="teamName" (input)="onInputChange()" placeholder="Enter your team name">
        </div>

        <div class="form-group">
            <label>Description (optional)</label>
            <textarea [(ngModel)]="description" (input)="onInputChange()" rows="3"
                placeholder="Describe your team..."></textarea>
        </div>

        <div class="form-group">
            <label>Team Logo</label>
            <div class="logo-upload-area">
                <div class="logo-preview" *ngIf="logoPreview">
                    <img [src]="logoPreview" alt="Team logo">
                    <button class="btn-remove-logo" (click)="removeLogo()">✖</button>
                </div>
                <div class="logo-placeholder" *ngIf="!logoPreview">
                    <span>🏆</span>
                    <p>No logo uploaded</p>
                </div>
                <input type="file" #fileInput accept="image/png,image/jpeg,image/jpg" (change)="onLogoUpload($event)"
                    style="display: none">
                <button class="btn-upload" (click)="fileInput.click()">
                    📁 Upload Logo
                </button>
                <span class="hint">PNG, JPG up to 2MB</span>
            </div>
        </div>
    </div>
</div>
