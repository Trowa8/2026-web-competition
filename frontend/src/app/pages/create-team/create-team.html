<div class="create-team-page">
    <nav class="navbar">
        <div class="logo">🏆 Judge Portal</div>
    </nav>

    <div class="hero">
        <h1>Create Team</h1>
        <p>Build your dream team and compete together</p>
    </div>

    <div class="breadcrumb">
        <span>Home</span> → <span>Create</span>
    </div>

    <div class="main-container">
        <div class="left-column">
            <div class="card">
                <div class="card-header">
                    <h2>Create</h2>
                    <span class="badge">Contents</span>
                </div>
                <div class="card-body">
                    <div class="form-group">
                        <label>Team name</label>
                        <input type="text" [(ngModel)]="teamName" placeholder="Create">
                    </div>
                    <div class="form-group">
                        <label>Description of your team</label>
                        <textarea [(ngModel)]="description" rows="3" placeholder="Description of your team"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Team image</label>
                        <input type="file" #fileInput (change)="onLogoUpload($event)" style="display: none">
                        <button class="btn-upload" (click)="fileInput.click()">📁 Upload</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2>List</h2>
                    <span class="badge">Suggested</span>
                </div>
                <div class="card-body">
                    <div *ngFor="let user of suggestedUsers" class="suggestion-item">
                        <span class="name">{{ user.name }}</span>
                        <button class="btn-add" (click)="addMember(user)">+ Add</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2>Members</h2>
                <button class="btn-add-member" (click)="showAddMemberForm = !showAddMemberForm">+ Add</button>
            </div>
            <div class="add-member-form" *ngIf="showAddMemberForm">
                <input type="text" [(ngModel)]="newMemberName" placeholder="Member name">
                <button class="btn-confirm" (click)="addManualMember()">Add</button>
                <button class="btn-cancel" (click)="showAddMemberForm = false">Cancel</button>
            </div>
            <div class="members-list">
                <div *ngFor="let member of members" class="member-item">
                    <span class="name">{{ member.name }}</span>
                    <button class="btn-remove" (click)="removeMember(member.id)">✖</button>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <span>© 2023 Judge Portal. All rights reserved.</span>
            <div class="contacts">
                <span>📧 Tournament@gmail.com</span>
                <span>📞 +380 66 657 66 67</span>
            </div>
        </div>
    </footer>
</div>
