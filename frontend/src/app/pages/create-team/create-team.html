<div class="page-container">
    <div class="form-layout">

        <div class="side-label">Create</div>
        <div class="main-content">
            <h2 class="title">Create team</h2>
            <button class="create-btn" [disabled]="isLoading || !teamData.name.trim()" (click)="onCreateTeam()">
                {{ isLoading ? 'Creating...' : 'Create' }}
            </button>
        </div>

        <div class="divider"></div>

        <div class="side-label">Contents</div>
        <div class="main-content grid-content">
            <div class="input-block">
                <label>Team name</label>
                <input type="text" [(ngModel)]="teamData.name" name="teamName" placeholder="type name...">
            </div>

            <div class="description-card">
                <div class="avatar-placeholder"></div>
                <div class="card-info">
                    <label>Description</label>
                    <textarea [(ngModel)]="teamData.description" name="teamDesc"
                        placeholder="Description of team"></textarea>
                </div>
            </div>
        </div>

    </div>
</div>
