<div class="tournament-container">
    <header class="header">
        <div class="header-left">
            <div class="logo-circle"></div>
            <nav>
                <span>Home</span>
                <span>Tasks</span>
                <span>Profile</span>
            </nav>
        </div>
        <div class="search-bar">
            <input type="text" placeholder="Search in site">
        </div>
    </header>

    <main class="main-content">
        @if (tournament()) {
        <section class="title-section">
            <h1>{{ tournament()!.name }}</h1>
            <p class="subtitle">{{ tournament()!.description }}</p>
        </section>

        <div class="line-divider"></div>

        <section class="action-section">
            <button class="btn-reg" (click)="register()">Reg on tournament</button>
        </section>

        <div class="details-grid">
            <div class="info-box">
                <h2>Tournament info</h2>
                <p class="small-info">info</p>
            </div>

            <div class="stats-box">
                <span class="label">Number of teams</span>
                <span class="value">{{ numberOfTeams() }}</span>
            </div>
        </div>

        <footer class="footer-dates">
            <div class="date-row">Start {{ tournament()!.start_date }}</div>
            <div class="date-row">End {{ endDate() }}</div>
        </footer>
        } @else {
            <div>Tournament not found</div>
        }
    </main>
</div>
