<div class="submit-page">
    <div class="hero">
        <h1>Task Submission</h1>
        <p>Submit your solution for the tournament task</p>
    </div>

    <div class="main-container">
        <div class="left-column">
            <app-team-info [teamName]="teamName" [isEditing]="isEditingTeam" [newTeamName]="newTeamName"
                (editTeam)="startEditTeam()" (saveTeam)="saveTeamName()" (cancelEdit)="cancelEditTeam()"
                (updateName)="newTeamName = $event">
            </app-team-info>

            <app-problem-statement></app-problem-statement>

            <app-members-list (addMember)="onAddMember($event)"></app-members-list>
        </div>

        <div class="right-column">
            <app-code-editor (submitted)="onSolutionSubmitted($event)"></app-code-editor>
        </div>
    </div>

</div>
