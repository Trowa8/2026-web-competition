<div class="submit-page">
    <nav class="navbar">
        <div class="logo">🏆 Judge Portal</div>
        <div class="nav-links">
            <a href="#" (click)="goHome(); $event.preventDefault()">Home</a>
            <a href="#" (click)="goCommunity(); $event.preventDefault()">OurCommunity</a>
            <a href="#" (click)="goTournaments(); $event.preventDefault()">Tournaments</a>
            <a href="#" (click)="goMyTeam(); $event.preventDefault()">MyTeam</a>
            <a href="#" (click)="goProfile(); $event.preventDefault()">Name</a>
        </div>
    </nav>

    <div class="hero">
        <h1>Task Submission</h1>
        <p>Submit your solution for the tournament task</p>
    </div>

    <div class="main-container">
        <div class="left-column">
            <app-team-info [teamName]="teamName" [isEditing]="isEditingTeam" [newTeamName]="newTeamName"
                (editTeam)="startEditTeam()" (saveTeam)="saveTeamName()" (cancelEdit)="cancelEditTeam()"
                (updateName)="newTeamName = $event">
            </app-team-info>

            <app-problem-statement></app-problem-statement>

            <app-members-list (addMember)="onAddMember($event)"></app-members-list>
        </div>

        <div class="right-column">
            <app-code-editor (submitted)="onSolutionSubmitted($event)"></app-code-editor>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <span>© 2023 Judge Portal. All rights reserved.</span>
            <div class="contacts">
                <span>📧 Tournament@gmail.com</span>
                <span>📞 +380 66 657 66 67</span>
            </div>
        </div>
    </footer>
</div>
