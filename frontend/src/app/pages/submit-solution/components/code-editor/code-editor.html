<div class="card">
    <div class="card-header">
        <h2>Code Editor</h2>
        <span class="badge">Write your solution</span>
    </div>
    <div class="editor-container">
        <div class="toolbar">
            <button class="btn-example" (click)="loadExample()">📋 Example</button>
            <button class="btn-clear" (click)="clearCode()">🗑️ Clear</button>
        </div>
        <textarea [(ngModel)]="code" rows="12" placeholder="// Write your solution here..."></textarea>
        <div class="editor-footer">
            <span>📄 Lines: {{ lineCount }}</span>
            <span>🔤 Chars: {{ charCount }}</span>
            <button class="btn-submit" (click)="onSubmit()">🚀 Submit Solution</button>
        </div>
    </div>
</div>
