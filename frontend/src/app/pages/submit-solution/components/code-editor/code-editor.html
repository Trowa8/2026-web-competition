<div class="card">
    <div class="card-header">
        <h2>Code Editor</h2>
        <span class="badge">Write your solution</span>
    </div>
    <div class="editor-container">
        <textarea [(ngModel)]="code" placeholder="// Write your solution here..." rows="15"></textarea>
        <div class="editor-footer">
            <span>Lines: {{ code.split('\n').length }}</span>
            <span>Chars: {{ code.length }}</span>
            <button class="btn-submit" (click)="onSubmit()">🚀 Submit Solution</button>
        </div>
    </div>
</div>
