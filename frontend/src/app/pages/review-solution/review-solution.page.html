<div class="review-solution-page">
    <nav class="navbar">
        <div class="logo">🏆 Judge Portal</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">OurCommunity</a>
            <a href="#">Tournaments</a>
            <a href="#">MyTeam</a>
            <a href="#">Judge Panel</a>
        </div>
        <div class="user-menu">
            <span>👨‍⚖️</span>
            <span>Judge</span>
        </div>
    </nav>

    <div class="hero-section">
        <h1>Review Solution</h1>
        <p>Evaluate team submissions and provide feedback</p>
    </div>

    <div class="main-container">
        <div class="left-column">
            <app-solution-info [solution]="solution"></app-solution-info>
            <app-score-panel (scoreSubmitted)="onScoreSubmitted($event)"></app-score-panel>
        </div>

        <div class="right-column">
            <app-code-review [code]="codeContent"></app-code-review>
            <app-feedback-form (feedbackSubmitted)="onScoreSubmitted($event)"></app-feedback-form>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-left">
                <span>🏆 Judge Portal</span>
                <p>© 2023 Judge Portal. All rights reserved.</p>
            </div>
            <div class="footer-links">
                <a href="#">Contact us</a>
                <a href="#">Privacy Policy</a>
            </div>
            <div class="contacts">
                <span>📧 Tournament@gmail.com</span>
                <span>📞 +380 66 657 66 67</span>
            </div>
        </div>
    </footer>
</div>
