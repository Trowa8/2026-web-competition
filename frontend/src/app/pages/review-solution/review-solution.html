<div class="review-page">
    <nav class="navbar">
        <div class="logo">🏆 Judge Portal</div>
    </nav>

    <div class="hero">
        <h1>Review Solution</h1>
        <p>Evaluate team submission and provide feedback</p>
    </div>

    <div class="main-container">
        <div class="left-column">
            <app-solution-info [solution]="solution"></app-solution-info>
            <app-score-panel (scoreSubmitted)="onScoreSubmitted($event)"></app-score-panel>
        </div>

        <div class="right-column">
            <app-code-review [code]="solution.code"></app-code-review>
            <app-feedback-form (feedbackSubmitted)="onScoreSubmitted($event)"></app-feedback-form>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <span>© 2023 Judge Portal. All rights reserved.</span>
            <div class="contacts">
                <span>📧 Tournament@gmail.com</span>
                <span>📞 +380 66 657 66 67</span>
            </div>
        </div>
    </footer>
</div>
