<div class="login-container">
  <form class="login-form" (submit)="$event.preventDefault(); onLogin()">
    <h1>Sign In</h1>

    <div class="input-group">
      <label>Login</label>
      <input type="text" [(ngModel)]="loginData.login" name="login" placeholder="Your username">
    </div>

    <div class="input-group">
      <label>Password</label>
      <input type="password" [(ngModel)]="loginData.password" name="password" placeholder="••••••••">
    </div>

    <p class="error-text" *ngIf="errorMessage()">{{ errorMessage() }}</p>

    <button type="submit" [disabled]="isLoading()">
      {{ isLoading() ? 'Logging in...' : 'Enter' }}
    </button>
  </form>
</div>
