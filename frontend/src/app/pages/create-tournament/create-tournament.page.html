<div class="create-tournament-page">
    <nav class="navbar">
        <div class="logo">🏆 Judge Portal</div>
        <div class="nav-links">
            <a href="#">Home</a>
            <a href="#">OurCommunity</a>
            <a href="#">Tournaments</a>
            <a href="#">MyTeam</a>
            <a href="#">Name</a>
        </div>
        <div class="user-menu">
            <span>👤</span>
            <span>Organizer</span>
        </div>
    </nav>

    <div class="hero-section">
        <h1>Create Tournament</h1>
        <p>Set up a new competition and invite teams</p>
    </div>

    <div class="breadcrumb">
        <a href="#">Home</a>
        <span>→</span>
        <a href="#">Tournaments</a>
        <span>→</span>
        <span class="active">Create</span>
    </div>

    <div class="main-container">
        <div class="left-column">
            <app-tournament-form (tournamentInfoUpdated)="onTournamentInfoUpdated($event)"></app-tournament-form>

            <app-teams-list [teams]="tournament.teams" (teamRemoved)="onTeamRemoved($event)">
            </app-teams-list>
        </div>

        <div class="right-column">
            <app-leaderboard [teams]="leaderboardTeams"></app-leaderboard>

            <app-bracket-preview [teams]="tournament.teams" [numberOfTeams]="tournament.numberOfTeams">
            </app-bracket-preview>

            <button class="btn-create-tournament" (click)="onCreateTournament()">
                🚀 Create Tournament
            </button>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <div class="footer-left">
                <span>🏆 Judge Portal</span>
                <p>© 2023 Judge Portal. All rights reserved.</p>
            </div>
            <div class="footer-links">
                <a href="#">Contact us</a>
                <a href="#">Privacy Policy</a>
            </div>
            <div class="contacts">
                <span>📧 Tournament@gmail.com</span>
                <span>📞 +380 66 657 66 67</span>
            </div>
        </div>
    </footer>
</div>
