<div class="page-container">
    <div class="form-layout">
        <div class="side-label">Крок 1</div>
        <div class="main-content">
            <h2 class="title">Створити турнір</h2>
            <button class="create-btn" [disabled]="isLoading() || !tournamentData.name" (click)="onCreateTournament()">
                {{ isLoading() ? 'Обробка...' : 'Створити турнір' }}
            </button>
        </div>

        <div class="divider"></div>

        <div class="side-label">Основне</div>
        <div class="main-content grid-content">
            <div class="input-block">
                <label>Назва</label>
                <input type="text" [(ngModel)]="tournamentData.name" placeholder="Grand Slam 2026" />
            </div>
        </div>

        <div class="divider"></div>

        <div class="side-label">Settings</div>
        <div class="main-content grid-content">
            <div class="input-block">
                <label>Дата початку</label>
                <input type="date" [(ngModel)]="tournamentData.startDate" />
            </div>
            <div class="input-block">
                <label>Максимальна кількість команд</label>
                <input type="number" [(ngModel)]="tournamentData.maxTeams" />
            </div>
            <div class="description-full">
                <label>Опис</label>
                <textarea
                    [(ngModel)]="tournamentData.description"
                    placeholder="Tell about the rules and prizes..."
                ></textarea>
            </div>
        </div>
    </div>
</div>
