<div class="dashboard-wrapper">
    <aside class="sidebar">
        <div class="logo" routerLink="/tasks">Code//Arena</div>
        <nav>
            <div class="nav-label">TOURNAMENTS</div>
            <a class="nav-item" routerLink="/tasks" routerLinkActive="active">View All</a>
            <a class="nav-item active" routerLink="/create-tournament" routerLinkActive="active">+ Create New</a>

            <div class="nav-divider"></div>

            <div class="nav-label">MANAGEMENT</div>
            <a class="nav-item" routerLink="/team-profile" routerLinkActive="active">My Team</a>
        </nav>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div class="title-group">
                <h1>Create Tournament</h1>
                <p>Set up a new competition for the community.</p>
            </div>
        </header>

        <form [formGroup]="tournamentForm" (ngSubmit)="onSubmit()" class="create-form">
            <div class="form-grid">
                <div class="form-group full-width">
                    <label>Tournament Name *</label>
                    <input type="text" formControlName="name" placeholder="e.g. Summer Code Cup 2026">
                </div>

                <div class="form-group">
                    <label>Access Type</label>
                    <select formControlName="type">
                        <option value="Public">Public (Open for all)</option>
                        <option value="Private">Private (Invitation only)</option>
                        <option value="Team">Team-based</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Start Date *</label>
                    <input type="date" formControlName="date">
                </div>

                <div class="form-group full-width">
                    <label>Description</label>
                    <textarea formControlName="description" rows="5"
                        placeholder="Rules, prizes and details..."></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-outline" routerLink="/tasks">Cancel</button>
                <button type="submit" class="btn-black" [disabled]="tournamentForm.invalid">Launch Tournament</button>
            </div>
        </form>
    </main>
</div>
