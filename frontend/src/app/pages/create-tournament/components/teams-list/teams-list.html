<div class="card">
    <div class="card-header">
        <h2>Teams</h2>
        <span class="count">{{ teams.length }} / 16 teams</span>
    </div>
    <div class="card-body">
        <div class="add-team">
            <input type="text" [(ngModel)]="newTeamName" placeholder="Team name" (keyup.enter)="addTeam()">
            <button class="btn-add-team" (click)="addTeam()">+ Add</button>
        </div>

        <div class="teams-list" *ngIf="teams.length > 0">
            <div *ngFor="let team of teams" class="team-item">
                <span class="team-name">{{ team.name }}</span>
                <button class="btn-remove" (click)="removeTeam(team.id)">✖</button>
            </div>
        </div>

        <div class="empty-teams" *ngIf="teams.length === 0">
            <span>🏆</span>
            <p>No teams added yet</p>
        </div>

        <div class="suggested-teams">
            <h3>Suggested Teams</h3>
            <div *ngFor="let team of suggestedTeams" class="suggestion-item">
                <span>{{ team.name }}</span>
                <button (click)="addSuggestedTeam(team)">+ Join</button>
            </div>
        </div>
    </div>
</div>
