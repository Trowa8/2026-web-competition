<div class="card">
    <h3>Teams</h3>
    <table>
        <thead>
            <tr>
                <th>#</th>
                <th>Team Name</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let team of teams; let i = index">
                <td>{{ i + 1 }}</td>
                <td>{{ team }}</td>
            </tr>
        </tbody>
    </table>

    <div class="reg-section">
        <h4>Reg on tournament</h4>
        <button class="btn-register">Sign up</button>
    </div>
</div>
