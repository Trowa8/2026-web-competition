<div class="tournament-page">
    <nav class="navbar">
        <div class="logo">🏆 Judge Portal</div>
    </nav>

    <div class="main-container">
        <div class="left-column">
            <app-tournament-info [teamsCount]="tournamentInfo.teamsCount" [startDate]="tournamentInfo.startDate"
                [endDate]="tournamentInfo.endDate">
            </app-tournament-info>
            <app-teams-table></app-teams-table>
            <div class="registration-card">
                <h3>Reg on tournament</h3>
                <button class="btn-register" (click)="onSignUp()" [disabled]="isSignedUp">
                    {{ isSignedUp ? '✅ Registered' : 'Sign up' }}
                </button>
                <div class="signup-message" *ngIf="signUpMessage">{{ signUpMessage }}</div>
            </div>
        </div>

        <div class="right-column">
            <app-reviewing-panel></app-reviewing-panel>
            <app-scoring-status></app-scoring-status>
            <app-code-preview></app-code-preview>
        </div>
    </div>

    <footer class="footer">
        <div class="footer-content">
            <span>© 2023 Judge Portal. All rights reserved.</span>
            <div class="contacts">
                <span>📧 Tournament@gmail.com</span>
                <span>📞 +380 66 657 66 67</span>
            </div>
        </div>
    </footer>
</div>
