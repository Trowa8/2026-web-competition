<div class="table-wrapper">
    <table class="tournaments-table">
        <thead>
            <tr>
                <th>Назва турніру</th>
                <th>Початок</th>
                <th>Реєстрація до</th>
                <th>Дії</th>
            </tr>
        </thead>
        <tbody>
            @for (t of tournaments; track t.tournamentId) {
            <tr class="tournament-row">
                <td class="tournament-name">{{ t.name }}</td>
                <td>{{ t.startDate }}</td>
                <td>{{ t.registrationDeadline }}</td>
                <td><button class="btn-delete">Видалити</button></td>
            </tr>
            }
        </tbody>
    </table>
</div>
